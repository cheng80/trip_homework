spectaql:
  targetDir: ./public/graphql-docs
  targetFile: index.html
  themeDir: spectaql
  oneFile: true

introspection:
  metadataFile: ./docs/graphql/metadata.ko.json
  queryNameStrategy: capitalizeFirst
  fieldExpansionDepth: 2
  removeTrailingPeriodFromDescriptions: false

extensions:
  graphqlScalarExamples: true

info:
  title: TripTrip GraphQL API
  description: Codecamp 과제용 Practice GraphQL API의 Query, Mutation, 입력값과 반환 타입을 한글로 정리한 문서입니다.
  x-introItems:
    - title: 인증
      description: 인증 작업은 Authorization 헤더에 Bearer access token을 전달합니다. restoreAccessToken은 refresh token 쿠키를 사용합니다.
    - title: 오류 처리
      description: GraphQL 요청은 HTTP 200 응답이어도 errors 배열을 포함할 수 있으므로 data와 errors를 함께 확인합니다.
    - title: 문서 기준
      description: 필드와 타입은 live introspection, 한글 설명·인증·주의사항은 GraphQL API Lab의 과제용 practice 안내를 기준으로 합니다. 서버 정책은 변경될 수 있습니다.

servers:
  - url: https://main-practice.codebootcamp.co.kr/graphql
    description: Codecamp 과제용 Practice API
    production: true
    headers:
      - name: Authorization
        example: Bearer ACCESS_TOKEN
        comment: 인증이 필요한 Query와 Mutation에서 사용합니다.
